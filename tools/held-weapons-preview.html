<!doctype html><meta charset="utf-8"><title>Held weapon animation review</title><style>body{background:#192b32;color:#e7e6d4;font:16px system-ui}canvas{background:#293f48;border-radius:12px}h1{font-size:22px}</style><h1>Held weapons — ready, walking, and firing</h1><p>Rifle · Crossbow · Spear gun · AR15 · Machine gun · Pistol</p><canvas width="1100" height="600"></canvas><script src="../src/AlternateEarth.Client2D/held-weapons.js"></script><script>
const ctx=document.querySelector('canvas').getContext('2d'),weapons=['rifle','crossbow','spearGun','ar15','machineGun','pistol'];
function frame(now){ctx.clearRect(0,0,1100,600);weapons.forEach((weapon,i)=>{const x=180+(i%3)*365,y=115+Math.floor(i/3)*280;ctx.save();ctx.translate(x,y);ctx.fillStyle='#e7c16b';ctx.beginPath();ctx.arc(-20,-40,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#37689a';ctx.fillRect(-36,-23,33,42);ctx.strokeStyle='#e5bc8c';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-26,-12);ctx.lineTo(-15,10);ctx.lineTo(-4,6);ctx.moveTo(-8,-12);ctx.lineTo(22,12);ctx.stroke();HeldWeapons.draw(ctx,weapon,70,{now,moving:true,recoil:now%1800<180?Math.sin(now%1800/180*Math.PI):0});ctx.fillStyle='#e7e6d4';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText(weapon,0,85);ctx.restore();});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
