<!doctype html><meta charset="utf-8"><title>Gardens and water fixtures preview</title><style>body{background:#1c302c;color:#f1e4bd;font:16px system-ui;margin:24px}canvas{background:#567f46;border:2px solid #9baa67}dialog{background:#263c37;color:#f1e4bd;max-height:80vh;overflow:auto;max-width:760px}button{padding:10px;margin:6px}.garden-build-row{padding:6px;border-bottom:1px solid #ffffff30}.garden-placement-banner{position:fixed;top:15px;left:15px;background:#263c37;padding:16px;z-index:10}#actionMenu{display:inline-block}</style><h1>Gardens and water fixtures</h1><p>Click a garden or hose. Use Build garden to inspect material costs and placement. This is a visual preview.</p><canvas width="1100" height="630"></canvas><div id="actionMenu"></div><script src="../src/AlternateEarth.Client2D/survival.js"></script><script src="../src/AlternateEarth.Client2D/gardens.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let scale=24;const project=p=>({x:550+p.x*scale,y:350-p.y*scale*.69});
const entities=[{id:'home',kind:'building',position:{x:0,y:0},geometry:[{x:-4,y:-4},{x:4,y:-4},{x:4,y:4},{x:-4,y:4}],properties:{}},...['watermelon','raspberry','carrot','corn'].map((crop,i)=>({id:'garden'+i,kind:'resourceNode',position:{x:-13+i*8,y:10},properties:{subtype:'garden',itemType:crop,...(i===3?{state:'rubble'}:{})}})),{id:'hose',kind:'resourceNode',position:{x:5,y:-5},properties:{subtype:'gardenHose'}}];
const state={base:entities,baseById:new Map(entities.map(e=>[e.id,e])),players:new Map([['me',{id:'me',position:{x:6,y:-6}}]]),playerId:'me',privateState:{base:{buildingId:'home'}},scale};
const ring=(p,r,color)=>{ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();const c=project(p);ctx.ellipse(c.x,c.y,r*scale,r*scale*.69,0,0,Math.PI*2);ctx.stroke()};
const gui=Gardens.create({state,send:m=>{if(m.type==='requestGardenBuild')gui.options({center:{x:0,y:0},radius:40,craftingLevel:5,bookBonus:true,options:['watermelon','raspberry','carrot'].map(crop=>({crop,seeds:50,wood:20,fertilizer:5,successChance:.3,canBuild:true}))});else{alert(JSON.stringify(m));gui.result();}},stopTravel(){},showToast:alert,navigateTo:()=>{},beginFollowCommand:()=>{},ui:{actionMenu:document.querySelector('#actionMenu')},project,ring});gui.updateButton();
function draw(){scale=state.scale;ctx.clearRect(0,0,1100,630);const h=project({x:-4,y:4});ctx.fillStyle='#b69a72';ctx.fillRect(h.x,h.y,8*scale,8*scale*.69);ctx.fillStyle='#6e4732';ctx.fillRect(535,412,30,16);ctx.font='17px system-ui';ctx.fillStyle='#f8e6c7';ctx.fillText('HOME',524,354);for(const e of entities)Gardens.draw(ctx,e,project,scale);gui.overlay(ctx);requestAnimationFrame(draw)}draw();
function world(event){const r=canvas.getBoundingClientRect();return{x:(event.clientX-r.left-550)/scale,y:(350-event.clientY+r.top)/(scale*.69)}}canvas.onclick=e=>gui.click(world(e));canvas.onmousemove=e=>gui.move(world(e));
</script>
