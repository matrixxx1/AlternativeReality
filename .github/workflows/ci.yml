name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore AlternateEarth.sln
      - run: dotnet build AlternateEarth.sln --configuration Release --no-restore
      - run: dotnet test AlternateEarth.sln --configuration Release --no-build
      - run: dotnet publish src/AlternateEarth.Server/AlternateEarth.Server.csproj --configuration Release --no-build --output artifacts/server
